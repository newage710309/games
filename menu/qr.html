<!doctype html>
<!--
  ゲーム一覧（https://rapid-apps.co.jp/games/）を共有するための QR コードのページ。
  ビルド不要の 1 ファイル。公開するときは会社サイトの files/games/qr.html にそのままコピーする。
  QR コードは https://rapid-apps.co.jp/games/ を表す SVG（npm の qrcode で作ったもの。URL が変わらないかぎり作り直し不要）。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QR コード｜ゲーム｜ラピッド・アプリケーションズ</title>
    <meta name="description" content="さくらちゃん シリーズ（ブラウザで遊べるミニゲーム）のページを開く QR コード。" />
    <meta name="theme-color" content="#050c1a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎮</text></svg>" />
    <style>
      /* ゲーム一覧（index.html）と同じ配色。 */
      :root {
        --navy-deepest: #050c1a;
        --cyan: #00d4ff;
        --cyan-faint: rgba(0, 212, 255, 0.06);
        --off-white: #e8edf5;
        --text: #cdd5e0;
        --muted: #6b7a99;
        --font-body: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, system-ui, sans-serif;
        --font-mono: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding:
          calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        background-color: var(--navy-deepest);
        background-image:
          linear-gradient(var(--cyan-faint) 1px, transparent 1px),
          linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text);
        font-family: var(--font-body);
        line-height: 1.7;
        text-align: center;
        -webkit-text-size-adjust: 100%;
      }

      .eyebrow {
        margin: 0;
        color: var(--cyan);
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.3em;
      }

      h1 { margin: 0; color: var(--off-white); font-size: clamp(22px, 5vw, 32px); line-height: 1.4; }

      .qr {
        margin: 0;
        padding: 16px 16px 12px;
        background: #ffffff;
        border-radius: 16px;
      }
      .qr svg { display: block; width: min(72vw, 52dvh, 360px); height: auto; }
      .qr figcaption { margin-top: 6px; color: #0b1428; font-size: 15px; font-weight: bold; }

      .note { margin: 0; font-size: 14px; }

      a { color: var(--muted); font-size: 13px; text-decoration: none; }
      a:hover, a:focus-visible { color: var(--cyan); }
    </style>
  </head>
  <body>
    <p class="eyebrow">GAMES</p>
    <h1>さくらちゃん シリーズ</h1>
    <figure class="qr">

      <figcaption>rapid-apps.co.jp/games</figcaption>
    </figure>
    <p class="note">スマホのカメラで読みとると、ゲーム一覧が開きます。</p>
