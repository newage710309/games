<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="かえるちゃん - 車と川を越えてお家を目指すフロッガー風アクションゲーム" />
    <meta name="theme-color" content="#0b1020" />
    <title>かえるちゃん</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐸</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="520" height="600" aria-label="かえるちゃん ゲーム画面"></canvas>
      <div id="pad" aria-hidden="true">
        <button data-action="pause" class="pad-btn pad-aux pad-pause" title="ポーズ">❚❚</button>
        <button data-action="mute"  class="pad-btn pad-aux pad-mute"  title="消音">🔊</button>
        <button data-dir="up"    class="pad-btn pad-up">▲</button>
        <button data-dir="left"  class="pad-btn pad-left">◀</button>
        <button data-dir="down"  class="pad-btn pad-down">▼</button>
        <button data-dir="right" class="pad-btn pad-right">▶</button>
      </div>
      <p class="hint">
        ← ↑ ↓ → / W A S D で移動 ・ <kbd>Space</kbd> 開始/リスタート ・ <kbd>P</kbd> ポーズ ・ <kbd>M</kbd> 消音
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
