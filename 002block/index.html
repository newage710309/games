<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="さくらちゃんのブロックくずし - ブロックをくずすと、かくれていたシマエナガのイラストが見えてくる全 3 面のブロックくずし" />
    <meta name="theme-color" content="#0b1020" />
    <title>さくらちゃんのブロックくずし</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐦</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="480" height="640" aria-label="さくらちゃんのブロックくずし ゲーム画面"></canvas>
      <div id="controls" aria-hidden="true">
        <button data-action="pause" class="ctl-btn" title="ポーズ">❚❚</button>
        <button data-action="mute" class="ctl-btn" title="消音">🔊</button>
      </div>
      <p class="hint">
        <a class="to-menu" href="../">← ゲーム一覧</a> ・
        マウス / ← → でラケット ・ <kbd>クリック</kbd> <kbd>Space</kbd> 発射 ・ <kbd>P</kbd> ポーズ ・ <kbd>M</kbd> 消音
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
