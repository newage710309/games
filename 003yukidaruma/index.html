<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="さくらちゃんの雪だるま退治 - 氷のブロックを押してすべらせ、雪だるまをやっつける全 3 面のパズルアクション" />
    <meta name="theme-color" content="#0b1020" />
    <title>さくらちゃんの雪だるま退治</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛄</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="480" height="640" aria-label="さくらちゃんの雪だるま退治 ゲーム画面"></canvas>
      <!--
        タッチ端末用の十字キー。押したまま指をすべらせると向きが変わる（押しなおさなくてよい）。
        どちらの向きかは、中心からのずれで決める（input.ts）。押している向きは data-dir に入る。
      -->
      <div id="pad" aria-hidden="true">
        <svg viewBox="0 0 150 150">
          <circle class="pad-base" cx="75" cy="75" r="72" />
          <path
            class="pad-cross"
            d="M55 8 h40 a6 6 0 0 1 6 6 v41 h41 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-41 v41 a6 6 0 0 1 -6 6 h-40 a6 6 0 0 1 -6 -6 v-41 h-41 a6 6 0 0 1 -6 -6 v-28 a6 6 0 0 1 6 -6 h41 v-41 a6 6 0 0 1 6 -6 z"
          />
          <path class="pad-arrow" data-for="up" d="M75 20 l14 18 h-28 z" />
          <path class="pad-arrow" data-for="down" d="M75 130 l14 -18 h-28 z" />
          <path class="pad-arrow" data-for="left" d="M20 75 l18 -14 v28 z" />
          <path class="pad-arrow" data-for="right" d="M130 75 l-18 -14 v28 z" />
          <circle class="pad-center" cx="75" cy="75" r="11" />
        </svg>
      </div>
      <p class="hint">
        <a class="to-menu" href="../">← ゲーム一覧</a> ・
        <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> いどう ・ <kbd>Space</kbd> 決定 ・ <kbd>P</kbd> ポーズ ・ <kbd>M</kbd> 消音
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
